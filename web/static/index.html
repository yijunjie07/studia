<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a6fd6'/%3E%3Cpath d='m9 16.5 4.5 4.5L23 11' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="studia.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="导航">
      <div class="sidebar_scroll">
        <div class="switcher_wrap"></div>
        <nav class="sidebar_nav"></nav>
      </div>
      <div class="sidebar_foot"></div>
    </aside>
    <main class="main">
      <div class="main_scroll"><div class="page"></div></div>
      <div class="toolbar" hidden></div>
      <div class="jobbar" hidden></div>
    </main>
  </div>

  <div class="overlay" data-overlay>
    <div class="finder" role="dialog" aria-label="快速查找">
      <div class="finder_input"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg><input placeholder="查找课程、试卷或页面" autocomplete="off"></div>
      <div class="finder_list"></div>
    </div>
  </div>
  <div class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="studia.js"></script>
</body>
</html>
